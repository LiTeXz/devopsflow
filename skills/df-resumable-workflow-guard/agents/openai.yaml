interface:
  display_name: "Resumable Workflow Guard"
  short_description: "Protect long-running or interruption-prone engineering work with explicit checkpoints, resume files, and handoff notes. Use when a task may span multiple turns or sessions, exceed about 30 minutes, touch multiple workflow stages, require repeated verification, approach context limits, resume after interruption or compaction, or when the user asks to continue, resume, checkpoint, monitor a long task, or hand off work."
  default_prompt: "Use $df-resumable-workflow-guard to decide whether this task needs checkpointed execution, create or update a resume file, and continue from the next incomplete step instead of restarting."
