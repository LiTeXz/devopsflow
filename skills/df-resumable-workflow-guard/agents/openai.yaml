interface:
  display_name: "Resumable Workflow Guard"
  short_description: "通过明确的 checkpoint、resume file 和交接说明保护长时间或易中断的工程工作。任务可能跨多轮或多个会话、耗时超过约 30 分钟、涉及多个工作流阶段、需要重复验证、接近上下文限制、在中断或压缩后续跑，或用户提到 continue、resume、checkpoint、long task、handoff、中断、继续、续跑、检查点、长任务或交接时使用。"
  default_prompt: "使用 $df-resumable-workflow-guard 判断此任务是否需要 checkpointed execution，创建或更新 resume file，并从下一个未完成步骤继续，而不是重新开始。"
