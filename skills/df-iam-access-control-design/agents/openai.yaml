interface:
  display_name: "Iam Access Control Design"
  short_description: "设计并评审适用于 REST、GraphQL、gRPC、protobuf 和混合 API surface 的严格 Google Cloud IAM-style 授权目录，覆盖 RBAC 与 ABAC。当 Codex 需要命名 permission 或 role、定义 role binding 与 CEL condition、将 API operation 映射到授权检查、迁移旧式冒号分隔 permission，或防止出现多套授权命名方案时使用。"
  default_prompt: "使用 $df-iam-access-control-design 设计严格的 IAM permission catalog 和 RBAC/ABAC binding。"
