interface:
  display_name: "Ddd Event Storming Design"
  short_description: "使用 Event Storming、CQRS 和需求追踪进行通用 DDD 领域建模。当 Codex 需要澄清原始业务需求、将干系人诉求拆分为需求条目、持续演进领域模型、识别参与者和多角色协作、Domain Event、Command、Policy、Aggregate、Domain Service 与 Read Model，生成结构化 Markdown 或可选的 Mermaid/PlantUML 图表，以及审查由 CRUD、数据库、包结构或 DDD 术语驱动而非由问题域驱动的设计时，使用此技能。尤其适用于公司、部门、岗位、员工、账号、角色或权限管理等看似 CRUD 的后台需求，此类需求应采用行为优先建模，而不是建立扁平的名词 Aggregate。"
  default_prompt: "使用 $df-ddd-event-storming-design 澄清原始业务需求、拆分需求条目、通过 Event Storming 进行分析、识别参与者、Command、Domain Event、Policy、Aggregate 和 Read Model，并生成可追踪且行为优先的 DDD 领域设计规范。"

policy:
  allow_implicit_invocation: true
