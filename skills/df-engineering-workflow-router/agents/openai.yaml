interface:
  display_name: "Engineering Workflow Router"
  short_description: "强制工程工作流路由器。在软件开发、重构、缺陷修复、领域建模、Glue Coding、API 或授权设计、代码审查、验证、分支收尾或 commit 准备开始时使用，用于对任务分类并选择必需的 skills，例如 df-resumable-workflow-guard、df-ddd-event-storming-design、df-glue-coding、df-iam-access-control-design、df-ddd-to-tdd-handoff、df-implementation-planning、df-executing-implementation-plan、df-tdd-skill、df-spring-web-boundaries、df-systematic-debugging、df-requesting-code-review、df-receiving-code-review、df-verification-before-completion、df-finishing-development-branch 或 df-parallel-agent-orchestration。"
  default_prompt: "使用 $df-engineering-workflow-router 对此工程任务分类，并在开始工作前选择强制 skills。"
