interface:
  display_name: "Dev Tdd"
  short_description: "适用于全新 feature development, 缺陷 fix, 行为保持型 refactor, 特征 tests 以及先刻画后 fix work 的纯 TDD workflow. 当 Codex 需要以 tests 优先的纪律从零构建新行为, or 在不引起行为漂移的前提下修改现有 code 时使用. 适用于各种 language and 架构. 不要用于技术栈专用分层 rule, 仅文档 edit, 简单格式调整, or 不期望产生可 execution 行为的纯探索性原型."
  default_prompt: "使用 $df-dev-tdd definition next 行为, 先 write 失败 tests, 达到 GREEN, 并且仅在 GREEN 后 refactor."
