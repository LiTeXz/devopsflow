interface:
  display_name: "Repository Tooling Hygiene"
  short_description: "将仅供人工使用的脚本、一次性维护 helper、本地环境 launcher 和 Gradle init script 移出高显著性的仓库根目录。清理 agent 上下文噪声、将 reset 或 run script 迁移到文档/skills，或把 Groovy init.gradle 片段转换为 Kotlin DSL init.gradle.kts 模板时使用。"
  default_prompt: "使用 $df-repository-tooling-hygiene 清理仓库根目录中仅供人工使用的脚本和 Gradle init 文件。"
